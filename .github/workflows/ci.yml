name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  delivery-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node --test deploy/cloudflare-subscription/worker.test.mjs
      - name: Verify Cloudflare runtime contract with synthetic upstream
        run: |
          npm install --prefix "$RUNNER_TEMP/keyholder-workerd" --ignore-scripts --no-audit --no-fund @cloudflare/workerd-linux-64@1.20261016.1
          WORKERD_BIN="$RUNNER_TEMP/keyholder-workerd/node_modules/@cloudflare/workerd-linux-64/bin/workerd" node --test deploy/cloudflare-subscription/runtime.test.mjs
  recovery-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r deploy/ansible/requirements.txt
      - run: ansible-playbook -i deploy/ansible/inventory/example.yml deploy/ansible/playbooks/bootstrap.yml --syntax-check
      - run: ansible-playbook -i deploy/ansible/inventory/example.yml deploy/ansible/playbooks/restore.yml --syntax-check
      - run: ansible-playbook -i deploy/ansible/inventory/example.yml deploy/ansible/playbooks/backup.yml --syntax-check
  checks:
    runs-on: ubuntu-latest
    env:
      KEYHOLDER_ADMIN_KEY: ci-synthetic-admin-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      KEYHOLDER_DATABASE_URL: sqlite:////tmp/keyholder-ci.db
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.0
      - run: uv sync --frozen --extra dev
      - run: uv run pytest -q
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src tests scripts
      - run: git diff --check
      - run: uv run alembic upgrade head
      - run: uv run python scripts/export_openapi.py --output /tmp/keyholder-openapi.json
      - run: uv build
      - run: docker build --tag keyholder:ci .
      - run: uv run python scripts/export_source.py --output /tmp/keyholder-source.tar.gz
      - name: Scan source and history for secrets
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.1
          package="gitleaks_${version}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          curl --fail --silent --show-error --location "$base/$package" --output "/tmp/$package"
          curl --fail --silent --show-error --location "$base/gitleaks_${version}_checksums.txt" --output /tmp/checksums.txt
          cd /tmp
          sha256sum --check --ignore-missing checksums.txt
          tar -xzf "$package" gitleaks
          cd "$GITHUB_WORKSPACE"
          /tmp/gitleaks git --redact --no-banner .
