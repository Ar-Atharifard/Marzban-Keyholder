title = "Keyholder secret scanning"
[extend]
useDefault = true

[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "The exact example Docker container identifier is not a credential"
condition = "AND"
paths = ['''scripts/admin/(host\.py|README\.md)$''']
regexTarget = "line"
regexes = ['''^\s*"api_container":\s*"keyholder-api-1",?\s*$''']

[[rules.allowlists]]
description = "Synthetic B2 key used by credential permission tests"
condition = "AND"
paths = ['''tests/test_recovery\.py$''']
regexTarget = "line"
regexes = ['''^\s*"key":\s*"syntheticApplicationKey123456",?\s*$''']
