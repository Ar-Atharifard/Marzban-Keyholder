# Include inside the gateway http block. Explicit panel/proxy/subscription hosts
# take precedence; this supplies a homepage for the apex and other subdomains.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name javatechpack.ir *.javatechpack.ir;
    ssl_certificate /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /usr/share/nginx/html;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }
}
server {
    listen 80;
    listen [::]:80;
    server_name javatechpack.ir *.javatechpack.ir;
    return 308 https://$host$request_uri;
}
