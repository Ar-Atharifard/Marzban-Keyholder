# Add this root-only socket in global for telemetry and the recovery guard:
# stats socket /run/haproxy/keyholder.sock mode 600 level admin
# Add the SNI route to domestic_reality before its default_backend:
# use_backend frp_control if { src FOREIGN_IPV4 } { req.ssl_sni -i BACKHAUL_SNI }
backend frp_control
    server local 127.0.0.1:24431

# Rathole's foreign_exit bind_addr must move from 19980 to 19986 first.
# Keep subscription's Rathole service unchanged.
frontend foreign_backhaul
    bind 127.0.0.1:19980
    default_backend foreign_backhaul_paths

backend foreign_backhaul_paths
    option tcp-check
    timeout connect 3s
    timeout check 5s
    tcp-check connect
    tcp-check send-binary 050102
    tcp-check expect binary 0502
    default-server inter 3s fall 2 rise 3
    server rathole 127.0.0.1:19986 check backup
    server frp 127.0.0.1:19984 check
