global
    log /dev/log local0
    user haproxy
    group haproxy
    daemon
    maxconn 1024

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client 1h
    timeout server 1h

frontend domestic_reality
    bind 0.0.0.0:443
    # Enable only after external IPv6 validation and firewall review:
    # bind [::]:443 v6only
    tcp-request inspect-delay 5s
    tcp-request content accept if { req.ssl_hello_type 1 }
    # Replace this example with the existing subscription hostname.
    use_backend subscription_https if { req.ssl_sni -i subscription.example.org }
    # For a second REALITY transport, add a distinct target SNI backend here.
    default_backend domestic_xray

backend domestic_xray
    server local 127.0.0.1:12091 send-proxy-v2

backend subscription_https
    server foreign 127.0.0.1:19983
