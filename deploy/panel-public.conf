# Include inside the existing gateway's http block. Keep Marzban on loopback.
map $http_upgrade $panel_connection {
    default upgrade;
    '' close;
}
# A single administration hostname: no trust in user-supplied client-IP headers.
limit_req_zone $server_name zone=panel_login:1m rate=10r/m;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name edge.javatechpack.ir;
    ssl_certificate /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /dev/null crit;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $panel_connection;
    proxy_connect_timeout 3s;
    proxy_read_timeout 60s;
    proxy_cache off;
    proxy_max_temp_file_size 0;

    location = / { root /usr/share/nginx/html; try_files /index.html =404; }
    location = /api/admin/token {
        limit_req zone=panel_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
    }
    location / { proxy_pass http://127.0.0.1:8000; }
}

server {
    listen 80;
    listen [::]:80;
    server_name edge.javatechpack.ir;
    return 308 https://edge.javatechpack.ir$request_uri;
}
