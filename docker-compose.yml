name: keyholder
services:
  api:
    build: .
    ports:
      - "${KEYHOLDER_PUBLISH_ADDRESS:-127.0.0.1}:${KEYHOLDER_PUBLISH_PORT:-18000}:18000"
    command: [/app/.venv/bin/uvicorn, "keyholder.main:create_app", --factory, --host, "0.0.0.0", --port, "18000", --workers, "1", --no-access-log, --no-proxy-headers, --log-level, info]
    env_file: ${KEYHOLDER_ENV_FILE:-.env}
    environment:
      KEYHOLDER_DATABASE_URL: sqlite:////data/keyholder.db
    volumes:
      - keyholder-data:/data
    restart: unless-stopped
    mem_limit: 256m
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, /app/.venv/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  keyholder-data:
