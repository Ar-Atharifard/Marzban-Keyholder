name: keyholder
services:
  api:
    build: .
    ports:
      - "${KEYHOLDER_PUBLISH_ADDRESS:-127.0.0.1}:${KEYHOLDER_PUBLISH_PORT:-18000}:${KEYHOLDER_API_PORT:-18000}"
    command: [/app/.venv/bin/uvicorn, "keyholder.main:create_app", --factory, --host, "${KEYHOLDER_BIND_HOST:-0.0.0.0}", --port, "${KEYHOLDER_API_PORT:-18000}", --workers, "1", --no-access-log, --no-proxy-headers, --log-level, "${KEYHOLDER_LOG_LEVEL:-info}"]
    env_file: ${KEYHOLDER_ENV_FILE:-.env}
    environment:
      KEYHOLDER_DATABASE_URL: ${KEYHOLDER_CONTAINER_DATABASE_URL:-sqlite:////data/keyholder.db}
    volumes:
      - keyholder-data:/data
    restart: unless-stopped
    mem_limit: ${KEYHOLDER_API_MEMORY_LIMIT:-256m}
    pids_limit: ${KEYHOLDER_API_PIDS_LIMIT:-128}
    read_only: true
    tmpfs:
      - /tmp:size=${KEYHOLDER_API_TMPFS_SIZE:-16m},mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, /app/.venv/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${KEYHOLDER_API_PORT:-18000}/health', timeout=3)"]
      interval: ${KEYHOLDER_HEALTH_INTERVAL:-30s}
      timeout: ${KEYHOLDER_HEALTH_TIMEOUT:-5s}
      retries: ${KEYHOLDER_HEALTH_RETRIES:-3}
    logging:
      driver: json-file
      options:
        max-size: ${KEYHOLDER_LOG_MAX_SIZE:-10m}
        max-file: "${KEYHOLDER_LOG_MAX_FILES:-3}"
volumes:
  keyholder-data:
