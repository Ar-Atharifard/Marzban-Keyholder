[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "keyholder"
version = "0.2.0"
description = "Stable, provider-adaptable proxy subscription delivery"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "pydantic-settings>=2.6,<3",
    "httpx>=0.27,<1",
    "cryptography>=46,<51",
]
[project.scripts]
keyholder = "keyholder.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "mypy>=1.14,<2"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.mypy]
python_version = "3.12"
strict = true
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/keyholder"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "migrations", "scripts", "deploy", "docs", ".github", ".gitleaks.toml", "README.md", "LICENSE", "CONTRIBUTING.md", "SECURITY.md", "pyproject.toml", "uv.lock", "alembic.ini", "docker-compose.yml", ".env.example", ".gitignore", ".dockerignore"]
exclude = [".private", ".audit", ".venv", "dist", "build", "data", "logs"]
